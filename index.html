<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Ramisha 🎂✨</title>

<style>
    body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background-color: #ffe6ee;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
    }

    /* First screen */
    #startScreen {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .start-btn {
        padding: 15px 40px;
        background-color: #ff4f8b;
        color: white;
        font-size: 22px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
    }
    .start-btn:hover {
        transform: scale(1.1);
    }

    /* Slides */
    #slidesContainer {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100%;
    }

    .slide {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fade 1s ease-in-out;
    }

    @keyframes fade {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    img {
        width: 330px;
        height: 330px;
        object-fit: cover;
        border-radius: 22px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        margin-bottom: 20px;
    }

    h2 {
        font-size: 26px;
        color: #ff2e75;
        width: 90%;
    }
</style>
</head>

<body>

<div id="startScreen">
    <button class="start-btn" onclick="startCard()">Start ✨</button>
</div>

<div id="slidesContainer"></div>

<audio id="bgMusic" src="music.mp3"></audio>

<script>
const slidesData = [
    { img: "pic1.jpg", text: "The day I saw you, something changed inside me 💗" },
    { img: "pic2.jpg", text: "You are not aware… how beautiful your smile is ✨" },
    { img: "pic3.jpg", text: "Even your smallest presence can make days brighter 🌸" },
    { img: "cat1.jpg", text: "If I were a cat, I’d choose to sit near you always 🐾" },
    { img: "cat2.jpg", text: "Cats choose their humans… and I choose you 💞" },
    { img: "cat3.jpg", text: "You deserve happiness, love, peace. Always. 🌷" },
    { img: "pic1.jpg", text: "I know I can’t be part of your life… but you’ll always have a place in my heart ❤️" },
    { img: "pic2.jpg", text: "Happy Birthday, Ramisha ✨" }
];

let currentSlide = 0;

function startCard() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("slidesContainer").style.display = "flex";

    const music = document.getElementById("bgMusic");
    music.volume = 0.5;
    music.play();

    showSlides();
}

function showSlides() {
    const container = document.getElementById("slidesContainer");
    container.innerHTML = "";

    const slide = document.createElement("div");
    slide.className = "slide";

    slide.innerHTML = `
        <img src="${slidesData[currentSlide].img}">
        <h2>${slidesData[currentSlide].text}</h2>
    `;

    container.appendChild(slide);

    currentSlide++;
    if (currentSlide < slidesData.length) {
        setTimeout(showSlides, 3500);
    }
}
</script>

</body>
</html>
